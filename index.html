<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1613">
<title>The Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Russo+One&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Shrikhand&family=Lilita+One&family=Lobster&family=Anton&display=swap">
<style>
  /* phone browsers: size everything to the VISIBLE viewport (address bar and toolbar showing). --app-h / --app-top come from visualViewport (src/ui/hud.ts) */
  html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; background: #0e1613; touch-action: none; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  body { position: fixed; inset: 0; }
  #app { position: fixed; left: 0; right: 0; top: var(--app-top, 0px); height: var(--app-h, 100dvh); }
  #app canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; touch-action: none; }
  .intro { position: fixed; left: 0; right: 0; top: var(--app-top, 0px); height: var(--app-h, 100dvh); box-sizing: border-box; display: grid; align-items: end; justify-items: center; padding: 24px max(20px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); background: linear-gradient(180deg, rgba(11,26,51,.0) 45%, rgba(11,26,51,.55) 78%, rgba(11,26,51,.82) 100%); transition: opacity .6s; font-family: 'Nunito', system-ui, sans-serif; color: #fff; }
  .intro.gone { opacity: 0; pointer-events: none; transition: opacity .8s .25s; background: none; }
  .intro.gone .brand { transform: translateY(-60px); opacity: 0; transition: transform .6s cubic-bezier(.5,0,.7,.4), opacity .5s; animation: none; }
  .intro.gone .intro-card { transform: translateY(90px); opacity: 0; transition: transform .6s cubic-bezier(.5,0,.7,.4), opacity .5s; animation: none; }
  .intro-card { display: grid; justify-items: center; gap: 10px; text-align: center; animation: introIn .9s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes introIn { from { opacity: 0; transform: translateY(40px) scale(.94); } to { opacity: 1; transform: none; } }
  .intro .brand { display: inline-flex; align-items: center; gap: 10px; padding: 5px 16px 5px 5px; border-radius: 999px; background: rgba(255,250,240,.94); color: #13294b; box-shadow: 0 3px 0 #e6cd94, 0 10px 24px rgba(0,0,0,.3); }
  .intro .brand .crest { width: 38px; height: 38px; border-radius: 50%; background: var(--crest) center/122% no-repeat, #13294b; box-shadow: 0 0 0 2px #ffd23f; }
  .intro .brand b { font: 700 15px/1.05 'Fredoka', sans-serif; letter-spacing: .08em; text-transform: uppercase; text-align: left; }
  /* the player's name: three looks tried (data-name-style on .intro); 'a' is the pick */
  .intro h1 { margin: 2px 0 0; line-height: .9; color: #fbf3df; text-transform: none; letter-spacing: .01em; paint-order: stroke fill; }
  .intro[data-name-style="a"] h1 { font: 400 clamp(70px, 21vw, 140px)/.95 'Shrikhand', 'Fredoka', sans-serif; -webkit-text-stroke: 7px #1d4a2c; text-shadow: 0 5px 0 #1d4a2c, 0 8px 0 #c9a227, 0 18px 26px rgba(0,0,0,.45); transform: rotate(-4deg); }
  .intro[data-name-style="b"] h1 { font: 400 clamp(78px, 24vw, 150px)/.9 'Lilita One', 'Fredoka', sans-serif; letter-spacing: .03em; -webkit-text-stroke: 6px #1d4a2c; text-shadow: 0 6px 0 #c9a227, 0 9px 0 #1d4a2c, 0 18px 26px rgba(0,0,0,.45); }
  .intro[data-name-style="c"] h1 { font: 400 clamp(98px, 30vw, 190px)/.95 'Lobster', 'Fredoka', cursive; -webkit-text-stroke: 6px #1d4a2c; text-shadow: 0 5px 0 #1d4a2c, 0 9px 0 #c9a227, 0 18px 26px rgba(0,0,0,.45); transform: rotate(-5deg); }
  .intro .tap { margin-top: 14px; font: 700 15px/1 'Fredoka', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #fbf3df; background: rgba(29,74,44,.82); padding: 10px 18px 11px; border-radius: 999px; box-shadow: 0 0 0 2px rgba(201,162,39,.8); animation: tapPulse 1.6s ease-in-out infinite; }
  @keyframes tapPulse { 0%, 100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.06); opacity: 1; } }
  .intro { cursor: pointer; }
  /* the title lockup sits at the top: crest + THE HUNT */
  .intro .brand { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; top: calc(max(18px, env(safe-area-inset-top)) + 22px); gap: 14px; padding: 7px 26px 7px 7px; white-space: nowrap; animation: introIn .9s cubic-bezier(.2,1.4,.4,1) both; }
  .intro .brand .crest { width: 60px; height: 60px; box-shadow: 0 0 0 3px #c9a227; }
  .intro .brand b { font-size: clamp(22px, 7vw, 30px); letter-spacing: .1em; color: #1d4a2c; }
  .intro .kick { display: inline-flex; align-items: center; gap: 9px; font: 800 13px/1 'Nunito', sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #ffd23f; padding: 4px 14px 4px 4px; border-radius: 999px; background: rgba(29,74,44,.85); }
  /* Neil's portrait beside 'Player 1' (the image URL comes from the HUD, imported through Vite) */
  .intro .kick::before { content: ""; width: 38px; height: 38px; border-radius: 50%; background: var(--portrait) center/cover no-repeat, #fffaf0; box-shadow: 0 0 0 2px #0b1a33, 0 0 0 4px #ffd23f; }
  .intro button { margin-top: 10px; display: inline-flex; align-items: center; gap: 12px; font: 700 22px/1 'Fredoka', sans-serif; letter-spacing: .03em; color: #13294b; background: linear-gradient(180deg, #ffe066, #ffc21a); border: 0; padding: 14px 28px 16px 14px; border-radius: 999px; cursor: pointer; box-shadow: 0 5px 0 #c98f00, 0 14px 30px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6); transition: transform .12s cubic-bezier(.3,1.6,.5,1), box-shadow .12s; animation: nudge 2.6s ease-in-out 1.2s infinite; }
  .intro button .ball { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff 0 30%, #e7ebf0 70%, #c3cad4); box-shadow: inset 0 0 0 1px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.25); position: relative; }
  .intro button .ball::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(120,132,150,.35) 1.2px, transparent 1.6px) 0 0/6px 6px; opacity: .8; }
  .intro button:active { transform: translateY(4px) scale(.97); box-shadow: 0 1px 0 #c98f00, 0 6px 14px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6); }
  .intro button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  @keyframes nudge { 0%, 85%, 100% { transform: none; } 90% { transform: translateY(-4px) rotate(-1.5deg); } 95% { transform: translateY(0) rotate(1deg); } }
  /* ── intro layouts (?intro=a|b|c): no "Player 1", the name in a bold condensed face ── */
  .intro[data-layout] { background: none; }
  .intro .il-eyebrow { display: inline-flex; align-items: center; gap: 9px; font: 600 13px/1 'Barlow', sans-serif; letter-spacing: .32em; text-transform: uppercase; color: #fbf3df; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  .intro .il-eyebrow .crest { width: 30px; height: 30px; border-radius: 50%; background: var(--crest) center/122% no-repeat, #13294b; box-shadow: 0 0 0 2px #ffd23f; }
  .intro[data-layout] h1 { margin: 0; font: 400 clamp(120px, 38vw, 220px)/.86 'Anton', 'Barlow Condensed', sans-serif; letter-spacing: .005em; text-transform: uppercase; color: #fff; -webkit-text-stroke: 0; text-shadow: 0 4px 30px rgba(0,0,0,.35); transform: none; }
  .intro .il-rule { display: block; width: 54px; height: 6px; border-radius: 2px; background: #ffd23f; box-shadow: 0 0 14px rgba(255,210,63,.7); }
  .intro[data-layout] .tap { margin: 0; background: none; box-shadow: none; padding: 0; font: 600 12.5px/1 'Barlow', sans-serif; letter-spacing: .3em; color: rgba(255,250,240,.92); text-shadow: 0 1px 8px rgba(0,0,0,.6); animation: tapBreath 2.2s ease-in-out infinite; }
  @keyframes tapBreath { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  .intro[data-layout] .tap::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 10px; border-radius: 50%; background: #ffd23f; box-shadow: 0 0 10px #ffd23f; vertical-align: 1px; }
  /* a: close-up, a cinematic bottom lockup on a dark fade */
  .intro[data-layout="a"] { background: linear-gradient(180deg, rgba(8,18,34,.35) 0%, rgba(8,18,34,0) 22%, rgba(8,18,34,0) 52%, rgba(8,18,34,.72) 82%, rgba(8,18,34,.9) 100%); }
  .intro[data-layout="a"] .il-lock { display: grid; justify-items: start; gap: 12px; width: 100%; padding: 0 6px 18px; animation: introIn .9s cubic-bezier(.2,1.2,.4,1) both; }
  .intro[data-layout="a"] h1 { margin: -4px 0 -6px -4px; }
  /* b: wide golden hour, the name editorial at the top-left over a soft sky fade */
  .intro[data-layout="b"] { background: linear-gradient(180deg, rgba(8,18,34,.55) 0%, rgba(8,18,34,.15) 34%, rgba(8,18,34,0) 50%, rgba(8,18,34,0) 80%, rgba(8,18,34,.5) 100%); justify-items: start; }
  .intro[data-layout="b"] .il-top { position: absolute; left: max(20px, env(safe-area-inset-left)); top: calc(max(18px, env(safe-area-inset-top)) + 14px); display: grid; justify-items: start; gap: 10px; animation: introIn .9s cubic-bezier(.2,1.2,.4,1) both; }
  .intro[data-layout="b"] h1 { font-size: clamp(150px, 46vw, 260px); margin-left: -6px; }
  .intro[data-layout="b"] .tap { justify-self: center; margin-bottom: 14px; }
  /* c: the live 3D face in a gold medallion, the name under it */
  .intro[data-layout="c"] { align-items: end; background: radial-gradient(circle at 50% calc(18% + 88px), rgba(8,18,34,0) 0 92px, rgba(8,18,34,.3) 170px, rgba(8,18,34,.8) 100%); }   /* clear over the medallion: the live face is drawn on the canvas under it */
  .intro[data-layout="c"] .il-stack { position: absolute; left: 0; right: 0; top: 18%; display: grid; justify-items: center; gap: 6px; animation: introIn .9s cubic-bezier(.2,1.4,.4,1) both; }
  .intro .il-medal { width: 176px; height: 176px; border-radius: 50%; position: relative; box-shadow: 0 0 0 4px #fffaf0, 0 0 0 9px #ffd23f, 0 0 40px 10px rgba(255,210,63,.35), 0 18px 40px rgba(0,0,0,.45); }
  .intro .il-medal .face-wrap { display: block; width: 176px; height: 176px; }
  .intro .il-medal .face-badge { width: 176px !important; height: 176px !important; box-shadow: none !important; }
  .intro .il-medal .face-name, .intro .il-medal .face-word, .intro .il-medal .face-bubble { display: none !important; }
  .intro[data-layout="c"] h1 { font-size: clamp(110px, 34vw, 190px); margin-top: 8px; }
  .intro[data-layout="c"] .tap { margin-bottom: 26px; }
  /* a, polished: a tighter lockup — the crest wordmark, the name, a short gold rule and a quiet cue, left-aligned on one edge */
  .intro[data-layout="a"] { background: linear-gradient(180deg, rgba(20,12,4,.28) 0%, rgba(20,12,4,0) 20%, rgba(20,12,4,0) 56%, rgba(14,10,6,.55) 78%, rgba(10,8,6,.86) 100%); }
  .intro[data-layout="a"] .il-lock { gap: 8px; padding: 0 8px 22px; }
  .intro[data-layout="a"] .il-eyebrow { font-size: 11.5px; letter-spacing: .34em; gap: 8px; color: #ffe6a8; }
  .intro[data-layout="a"] .il-eyebrow .crest { width: 26px; height: 26px; }
  .intro[data-layout="a"][data-case="proper"] h1 { text-transform: none; font-size: clamp(118px, 36vw, 210px); line-height: .84; letter-spacing: -.005em; margin: 0 0 2px -3px; }
  .intro[data-layout="a"][data-case="caps"] h1 { font-size: clamp(118px, 36vw, 210px); line-height: .84; letter-spacing: .01em; margin: 0 0 2px -3px; }
  .intro[data-layout="a"] h1 { text-shadow: 0 2px 0 rgba(0,0,0,.18), 0 10px 40px rgba(0,0,0,.45); }
  .intro[data-layout="a"] .il-rule { width: 40px; height: 4px; margin: 2px 0 6px; }
  .intro[data-layout="a"] .tap { font-size: 11.5px; letter-spacing: .28em; }
  .intro.gone .il-lock, .intro.gone .il-top, .intro.gone .il-stack { transform: translateY(40px); opacity: 0; transition: transform .6s cubic-bezier(.5,0,.7,.4), opacity .5s; animation: none; }
  @media (prefers-reduced-motion: reduce) { .intro .il-lock, .intro .il-top, .intro .il-stack, .intro[data-layout] .tap { animation: none; } }
  @media (orientation: landscape) { .intro { justify-items: start; background: linear-gradient(90deg, rgba(11,26,51,.78) 0%, rgba(11,26,51,.3) 42%, rgba(11,26,51,0) 65%); align-items: end; } .intro-card { justify-items: start; text-align: left; } }
  @media (prefers-reduced-motion: reduce) { .intro-card, .intro button, .intro .tap { animation: none; } }
  .rotate { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; text-align: center; background: #0e1613; color: #fff; font-family: 'Barlow', system-ui, sans-serif; padding: 24px; }
  .rotate b { display: block; font: 700 30px/1 'Barlow Condensed', sans-serif; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; color: #ffc72c; }
  .rotate svg { width: 72px; height: 72px; margin: 0 auto 16px; display: block; animation: tilt 2.4s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
</style>
</head>
<body>
<div id="app"></div>
<div class="rotate"><div><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="14" y="4" width="20" height="40" rx="4" fill="none" stroke="#fff" stroke-width="3"/><circle cx="24" cy="38" r="2" fill="#fff"/></svg><b>Turn your phone sideways</b>The range plays in landscape.</div></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
